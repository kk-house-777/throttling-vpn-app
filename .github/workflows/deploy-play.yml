name: Deploy to Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store track"
        required: true
        default: production
        type: choice
        options:
          - production
          - internal
          - alpha
          - beta

concurrency:
  group: deploy-play
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - uses: ./.github/actions/build-tun2socks-aar

      - name: Run unit tests
        run: ./gradlew testPlayDebugUnitTest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: play-store
    permissions:
      contents: write

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Bump versionCode
        run: |
          set -euo pipefail
          current=$(grep -oP '(?<=versionCode = )\d+' app/build.gradle.kts)
          next=$((current + 1))
          sed -i "s/versionCode = $current/versionCode = $next/" app/build.gradle.kts
          echo "versionCode: $current -> $next"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "ci: bump versionCode to $next [skip ci]"
          git push origin HEAD:main

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - uses: ./.github/actions/build-tun2socks-aar

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.jks

      - name: Build release AAB
        run: ./gradlew bundlePlayRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: okoge.house.throttling_app.play
          releaseFiles: app/build/outputs/bundle/playRelease/app-play-release.aab
          track: ${{ inputs.track }}
          whatsNewDirectory: distribution/whatsnew
