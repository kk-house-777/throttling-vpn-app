name: Unit Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21

      # cache-provider は MIT の basic を使う : デフォルトの enhanced はプロプライエタリな
      # gradle-actions-caching を読み込み Gradle の ToU 同意が必要になる
      # https://github.com/gradle/actions/blob/v6.3.0/DISTRIBUTION.md
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - uses: ./.github/actions/build-tun2socks-aar

      - name: Run unit tests
        run: ./gradlew testPlayDebugUnitTest

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: "**/build/reports/tests/"
          retention-days: 7
