name: Build tun2socks AAR
description: >
  Rebuilds app/libs/tun2socks.aar from go/tun2sockslib via gomobile.
  Not vendored as a binary: this repo ships an fdroid flavor, and F-Droid's
  build pipeline expects a reproducible build from source rather than an
  opaque prebuilt blob.

runs:
  using: composite
  steps:
    - name: Cache tun2socks AAR
      id: aar-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: app/libs
        key: tun2socks-aar-${{ hashFiles('go/tun2sockslib/**') }}

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      if: steps.aar-cache.outputs.cache-hit != 'true'
      with:
        go-version-file: go/tun2sockslib/go.mod
        cache-dependency-path: go/tun2sockslib/go.sum

    - name: Ensure Android NDK
      # The ubuntu runner image already ships this NDK (ANDROID_NDK_LATEST_HOME),
      # so normally nothing is downloaded here. Caching the NDK directory instead
      # of this check is actively harmful: the preinstalled tree is root-owned, so
      # actions/cache's tar restore fails with "Cannot utime: Operation not
      # permitted". sdkmanager only runs if a future image drops this version.
      if: steps.aar-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        if [ -d "$ANDROID_HOME/ndk/29.0.14206865" ]; then
          echo "NDK 29.0.14206865 already present, skipping install"
        else
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865"
        fi

    - name: gomobile bind
      if: steps.aar-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
        go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260410095206-2cfb76559b7b
        go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260410095206-2cfb76559b7b
        export PATH="$PATH:$(go env GOPATH)/bin"
        gomobile init
        mkdir -p app/libs
        cd go/tun2sockslib
        gomobile bind -target=android -androidapi 26 -o ../../app/libs/tun2socks.aar .
